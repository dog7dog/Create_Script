// CreateScript Core：Minecraft・NeoForge・Create・Kotlin for Forge に依存しない言語処理系のライブラリ
plugins {
    id 'java-library'
    // 版はルートの build.gradle で指定した 2.0.0 を使う（同じビルドの中で版を二重に指定できないため）
    id 'org.jetbrains.kotlin.jvm'
}

repositories {
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

kotlin {
    jvmToolchain(21)

    // MOD の実行時に Kotlin 標準ライブラリを供給する Kotlin for Forge 5.3.0 の kotlin-stdlib 2.0.0 に合わせる
    coreLibrariesVersion = '2.0.0'
    compilerOptions {
        apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
    }
}

dependencies {
    // JUnit（言語処理系の単体テスト用）
    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

// ./gradlew :createscript-core:test で JUnit Platform（JUnit Jupiter）のテストを実行する
tasks.named('test', Test) {
    useJUnitPlatform()
}
