// CreateScript Core：Minecraft・NeoForge・Create・Kotlin for Forge に依存しない言語処理系のライブラリ
plugins {
    id 'java-library'
    // 版はルートの build.gradle で指定した 2.0.0 を使う（同じビルドの中で版を二重に指定できないため）
    id 'org.jetbrains.kotlin.jvm'
}

repositories {
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

kotlin {
    jvmToolchain(21)

    // 公開 API の範囲を明示する（A2）。公開する宣言には public か internal を書き、公開する関数・プロパティの型も書く
    explicitApi()

    // MOD の実行時に Kotlin 標準ライブラリを供給する Kotlin for Forge 5.3.0 の kotlin-stdlib 2.0.0 に合わせる
    coreLibrariesVersion = '2.0.0'
    compilerOptions {
        apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
        // このモジュールの中（テストを含む）では内部 API を自由に使う（A2。外のモジュールには警告になる）
        optIn.add('com.creatrbypc.createanalytical.script.InternalCreateScriptApi')
    }
}

dependencies {
    // JUnit（言語処理系の単体テスト用）
    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

// ./gradlew :createscript-core:test で JUnit Platform（JUnit Jupiter）のテストを実行する
tasks.named('test', Test) {
    useJUnitPlatform()
}

// A3: 公開 API の一覧（api/createscript-core.api）。ApiListingTest が JDK 21 の javap でコンパイル済みのクラスから一覧を作って比べる。
// 一覧を書き直すのは CREATESCRIPT_API_UPDATE=1 のときだけ（docs/api/api-surface.md）。比べる処理は core と project で共有する
kotlin.sourceSets.test.kotlin.srcDir(rootProject.file('test-support/api-listing'))
tasks.named('test') {
    def listing = file('api/createscript-core.api')
    def mainClasses = sourceSets.main.output.classesDirs
    inputs.files(listing).withPropertyName('apiListing').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('apiUpdate', providers.environmentVariable('CREATESCRIPT_API_UPDATE').orElse(''))
    systemProperty 'createscript.api.listing', listing.absolutePath
    systemProperty 'createscript.api.classes', mainClasses.asPath
}
