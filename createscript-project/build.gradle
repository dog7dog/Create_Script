// CreateScript Project：プロジェクトのファイル（createscript.json・createscript.lock）の JSON・検査・正規形（S8.1）。
// Kotlin の標準ライブラリだけを使い、ファイル・ネットワークには触れない（読み書きは CLI が行う）。Minecraft・NeoForge・Create・Kotlin for Forge に依存しない
plugins {
    id 'java-library'
    // 版はルートの build.gradle で指定した 2.0.0 を使う（同じビルドの中で版を二重に指定できないため）
    id 'org.jetbrains.kotlin.jvm'
}

repositories {
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

kotlin {
    jvmToolchain(21)

    // Core と同じ Kotlin の版にそろえる
    coreLibrariesVersion = '2.0.0'
    compilerOptions {
        apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_0
    }
}

dependencies {
    // JUnit（単体テスト用）
    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
